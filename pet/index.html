<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熊大 · 悬浮宠物</title>
<style>
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#10222e; color:#eef6fb; }
  .wrap { max-width:560px; margin:0 auto; padding:22px 16px 40px; }
  h1 { font-size:22px; margin:6px 0 4px; }
  .sub { color:#9fc3d8; font-size:14px; margin-bottom:16px; }
  video { width:100%; border-radius:16px; background:#7ec8f7; display:block; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .steps { background:#17384a; border-radius:14px; padding:14px 16px; margin-top:18px; font-size:15px; line-height:1.75; }
  .steps b { color:#ffd166; }
  .note { color:#8fb0c4; font-size:13px; margin-top:14px; line-height:1.7; }
  #status { color:#ffd166; font-size:14px; margin:12px 0 0; min-height:20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐻 熊大 · 悬浮宠物</h1>
  <div class="sub">一只在草地上散步的熊大，送它出去，它就飘在你所有 App 上面陪你。</div>
  <video id="v" loop muted playsinline controls preload="auto"></video>
  <div id="status">正在把熊大接过来…</div>
  <div class="steps">
    <b>怎么放出来：</b><br>
    1️⃣ 点视频上的播放按钮，让熊大动起来<br>
    2️⃣ 播放中<b>上滑回到桌面</b>（或者点全屏后点「画中画」图标），视频会自动变成悬浮小窗<br>
    3️⃣ 切到微信、Safari 随便哪个 App，熊大都在角落陪着你<br>
    4️⃣ 想关掉：点一下小窗，再点 <b>×</b> 就收工
  </div>
  <div class="note">说明：悬浮时它是一个循环小动画，没法点它互动（iOS 的限制，所有这类宠物都一样）；小窗可以拖来拖去、贴边躲藏。想让它一直陪着，就别关这个页面标签。</div>
</div>
<script>
(async () => {
  const st = document.getElementById('status');
  const v = document.getElementById('v');
  try {
    const parts = [];
    for (let i = 0; ; i++) {
      const r = await fetch('d' + String(i).padStart(2, '0') + '.part', { cache: 'force-cache' });
      if (!r.ok) break;
      parts.push(await r.text());
    }
    if (!parts.length) throw new Error('no data');
    const bin = atob(parts.join(''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    v.src = URL.createObjectURL(new Blob([bytes], { type: 'video/mp4' }));
    st.textContent = '熊大到了，点播放吧 ▶';
    v.addEventListener('playing', () => { st.textContent = '趁现在上滑回桌面，熊大就飘出去了 🐻'; }, { once: true });
  } catch (e) {
    st.textContent = '没接上熊大，刷新一下页面再试。';
  }
})();
</script>
</body>
</html>
